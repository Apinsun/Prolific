<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prolific — génération en masse</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Prolific</h1>
    <span class="subtitle">génération d'images en masse — LLM + ComfyUI</span>
  </header>

  <main>
    <section id="panel-form">
      <h2>Nouveau job</h2>
      <form id="job-form">
        <label>Thème / prompt
          <textarea id="theme" rows="3" placeholder="ex : femmes dragons dans une forêt magique" required></textarea>
        </label>

        <div class="grid-2">
          <label>Workflow
            <select id="workflow"></select>
          </label>
          <label>Modèle (LLM)
            <select id="model"></select>
          </label>
        </div>

        <fieldset>
          <legend>Objectif</legend>
          <label class="inline"><input type="radio" name="objective_type" value="count" checked> Nombre de prompts</label>
          <label class="inline"><input type="radio" name="objective_type" value="duration"> Durée (minutes)</label>
          <div class="objective-input">
            <label>Nombre de prompts <input type="number" id="n" min="1" value="10"></label>
          </div>
          <div class="objective-input" id="duration-wrap" hidden>
            <label>Durée (minutes) <input type="number" id="minutes" min="1" value="20"></label>
          </div>
        </fieldset>

        <label>Images par prompt (batch)
          <input type="number" id="batch" min="1" value="1" title="Chaque prompt est généré ce nombre de fois, avec des seeds différents">
        </label>

        <label>Longueur min des prompts (tags/mots)
          <input type="number" id="min_words" min="0" value="0" title="0 = pas de minimum ; sinon le LLM enrichit les prompts trop courts">
        </label>

        <div class="grid-2">
          <label>Dimensions
            <select id="orientation">
              <option value="carre">Carré</option>
              <option value="paysage">Paysage</option>
              <option value="portrait">Portrait</option>
              <option value="random">Aléatoire</option>
              <option value="auto">Auto (le modèle choisit)</option>
            </select>
          </label>
          <label>Type de prompt
            <select id="style">
              <option value="tags">Tags (danbooru)</option>
              <option value="prose">Langage naturel</option>
              <option value="hybrid">Les deux</option>
            </select>
          </label>
        </div>

        <label>Prompt de base (preset)
          <select id="preset"><option value="">— défaut (draft_system.txt) —</option></select>
        </label>

        <label>Datasets RAG (recherche de termes)
          <div id="datasets" class="checks"></div>
        </label>
        <label>Datasets pour l'aléatoire (vide = mêmes que la recherche)
          <div id="random_datasets" class="checks"></div>
        </label>

        <label class="inline"><input type="checkbox" id="random_tags" disabled> Mots aléatoires (RAG)</label>
        <label>Nombre de mots aléatoires (par prompt)
          <input type="number" id="random_tags_count" min="1" value="15" disabled title="Combien de termes aléatoires proposer par prompt (le LLM garde ceux qui sont cohérents)">
        </label>

        <label>Préfixe positif (concaténé au DÉBUT du prompt — ex. trigger de LoRA)
          <input id="positive_prefix" placeholder="ex : laddybug_w0man, four arms, wings">
        </label>
        <label>Suffixe positif (concaténé au prompt)
          <input id="positive_suffix" placeholder="ex : masterpiece, best quality">
        </label>
        <label>Prompt négatif (remplace celui du workflow)
          <textarea id="negative" rows="2" placeholder="ex : lowres, bad anatomy"></textarea>
        </label>
        <label>Sous-dossier de sortie (relatif au dossier output de ComfyUI)
          <input id="filename_prefix" placeholder="ex : batch-prolificN1 (vide = dossier du workflow)">
        </label>
        <label>Taille du lot de rédaction (vide = tout en un appel)
          <input type="number" id="draft_batch_size" min="1" placeholder="ex : 20" title="Nombre max de prompts rédigés par appel LLM. Plus petit = plus fiable et varié, mais plus lent.">
        </label>
        <label>Recherches forcées (0 = le modèle décide)
          <input type="number" id="forced_searches" min="0" value="0" title="Nombre de recherches outils imposé au LLM avant la rédaction des prompts">
        </label>

        <label class="inline"><input type="checkbox" id="swap_vram"> Swap VRAM (LLM ↔ modèle d'image)</label>
        <label class="inline"><input type="checkbox" id="enable_traces" checked> Tracer (dataset fine-tuning)</label>
        <label class="inline"><input type="checkbox" id="test_mode"> Mode test (traces + métriques séparées)</label>
        <div class="grid-2">
          <label>Seed (optionnel) <input type="number" id="seed" placeholder="aléatoire"></label>
          <label>Température <input type="number" id="temperature" min="0" max="2" step="0.1" placeholder="auto (défaut du modèle)"><span id="temperature-hint" class="hint"></span></label>
        </div>

        <button type="submit" id="submit-btn">Lancer</button>
      </form>
    </section>

    <section id="panel-jobs">
      <div class="jobs-head">
        <h2>Jobs</h2>
        <button id="refresh-btn" class="ghost" type="button">Rafraîchir</button>
      </div>
      <div class="jobs-filters">
        <input id="jobs-search" type="search" placeholder="Rechercher (thème, id, workflow)...">
        <select id="jobs-status">
          <option value="">Tous les statuts</option>
          <option value="queued">En file</option>
          <option value="running">En cours</option>
          <option value="done">Terminé</option>
          <option value="failed">Échoué</option>
          <option value="stopped">Arrêté</option>
        </select>
      </div>
      <ul id="job-list"></ul>
      <div class="jobs-more">
        <button id="load-more-btn" class="ghost" type="button" hidden>Charger plus</button>
      </div>
      <div id="job-detail"><p class="meta">Sélectionne un job pour voir ses images.</p></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-prev" class="lb-nav" type="button" aria-label="Image précédente">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" class="lb-nav" type="button" aria-label="Image suivante">›</button>
    <span id="lightbox-counter" class="lb-counter"></span>
    <button id="lightbox-close" class="lb-close" type="button" aria-label="Fermer">✕</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
