[tool.poetry]
name = "prolific"
version = "0.1.0"
description = "Génération d'images en masse, orchestrée par un LLM (Ollama) + ComfyUI"
authors = ["Arnaud"]
readme = "README.md"
packages = [{ include = "prolific", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
fastmcp = ">=2.0"
chromadb = ">=0.5"
httpx = ">=0.27"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
pytest = ">=8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
